name: GW seat watch

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and often runs a few
    # minutes late; :00/:30 on the dot is not guaranteed.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # commit state.json back to the repo
  issues: write             # open the alert issue

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Check CRNs
        id: check
        env:
          CRNS: "53900,53901"
          SUBJECT: MATH
          COURSE: "2184"
          TERM: "202603"
          ALERT_FILE: alert.md
        run: python watch_crns.py

      - name: Open alert issue
        if: steps.check.outputs.opened == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # @-mentioning yourself guarantees a notification even if you are not
          # watching the repo. Replace with your own GitHub username.
          ME: your-github-username
        run: |
          TITLE=$(head -n 1 alert.md)
          BODY=$(tail -n +2 alert.md)
          gh issue create \
            --title "SEAT OPEN: $TITLE" \
            --body "@$ME $BODY"

      - name: Persist state
        if: always()
        run: |
          git config user.name  "seat-watch-bot"
          git config user.email "seat-watch-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%H:%M)"
          git push
