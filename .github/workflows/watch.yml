name: GW seat watch

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and often runs late.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check CRNs
        id: check
        env:
          CRNS: "53900,53901"
          SUBJECT: MATH
          COURSE: "2184"
          TERM: "202603"
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: python watch_crns.py

      - name: Open alert issue
        if: steps.check.outputs.opened == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ME: sashawin7
        run: |
          gh issue create \
            --title "SEAT OPEN: MATH 2184" \
            --body "@$ME A watched section just opened. Register: https://banweb.gwu.edu/"

      - name: Persist state
        if: always()
        run: |
          git config user.name "seat-watch-bot"
          git config user.email "seat-watch-bot@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%H:%M)"
          git push || true
