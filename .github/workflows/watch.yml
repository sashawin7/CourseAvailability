name: REL 1010 seat watch

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and often runs late.
    - cron: "*/7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check CRNs
        id: check
        env:
          # ---- edit these to watch a different course ----
          CRNS: "77673"
          SUBJECT: REL
          COURSE: "1010"
          TERM: "202701"
          CAMP: "1"
          # -----------------------------------------------
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: python watch_crns.py

      # Backup alert in case the email silently fails. Delete this step once
      # you have seen a real email arrive.
      - name: Open alert issue
        if: steps.check.outputs.opened == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ME: sashawin7
        run: |
          gh issue create \
            --title "SEAT OPEN: REL 1010 (CRN 77673)" \
            --body "@$ME The New Testament just opened. Register: https://banweb.gwu.edu/"

      - name: Persist state
        if: always()
        run: |
          git config user.name "seat-watch-bot"
          git config user.email "seat-watch-bot@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%H:%M)"
          git push || true
